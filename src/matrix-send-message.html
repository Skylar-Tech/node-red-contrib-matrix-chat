<script type="text/javascript">
    RED.nodes.registerType('matrix-send-message',{
        category: 'matrix',
        color: '#00b7ca',
        icon: "matrix.png",
        outputLabels: ["success", "error"],
        inputs:1,
        outputs:2,
        paletteLabel: 'Send Message',
        defaults: {
            name: { value: null },
            server: { type: "matrix-server-config" },
            roomId: { value: null },
            message: { value: null },
            messageType: { value: 'm.text' },
            messageFormat: { value: '' },
            replaceMessage : { value: false },
            threadReplyType: { value: "msg" },
            threadReplyValue: { value: "isThread" },
            replyToType: { value: "msg" },
            replyToValue: { value: "replyTo" },
            notifyReplySender: { value: true },
            mentionUsersType: { value: "msg" },
            mentionUsersValue: { value: "mentionUsers" },
            mentionRoomType: { value: "msg" },
            mentionRoomValue: { value: "mentionRoom" },
        },
        label: function() {
            return this.name || "Send Message";
        },
        oneditprepare: function() {
            $("#node-input-threadReply").typedInput({
                types:['msg','flow','global','bool'],
            })
                .typedInput('value', this.threadReplyValue || "isThread")
                .typedInput('type', this.threadReplyType || "msg");
            $("#node-input-replyTo").typedInput({
                types:['msg','flow','global','bool','str'],
            })
                .typedInput('value', this.replyToValue || "replyTo")
                .typedInput('type', this.replyToType || "msg");
            $("#node-input-mentionUsers").typedInput({
                types:['msg','flow','global','str','json'],
            })
                .typedInput('value', this.mentionUsersValue || "mentionUsers")
                .typedInput('type', this.mentionUsersType || "msg");
            $("#node-input-mentionRoom").typedInput({
                types:['msg','flow','global','bool'],
            })
                .typedInput('value', this.mentionRoomValue || "mentionRoom")
                .typedInput('type', this.mentionRoomType || "msg");
        },
        oneditsave: function() {
            this.threadReplyType = $("#node-input-threadReply").typedInput('type');
            this.threadReplyValue = $("#node-input-threadReply").typedInput('value');
            this.replyToType = $("#node-input-replyTo").typedInput('type');
            this.replyToValue = $("#node-input-replyTo").typedInput('value');
            this.mentionUsersType = $("#node-input-mentionUsers").typedInput('type');
            this.mentionUsersValue = $("#node-input-mentionUsers").typedInput('value');
            this.mentionRoomType = $("#node-input-mentionRoom").typedInput('type');
            this.mentionRoomValue = $("#node-input-mentionRoom").typedInput('value');
        },
    });
</script>

<script type="text/html" data-template-name="matrix-send-message">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>

 	 <div class="form-row">
     	<label for="node-input-server"><i class="fa fa-user"></i> Matrix Server Config</label>
     	<input type="text" id="node-input-server">
 	</div>

    <div class="form-row">
        <label for="node-input-roomId"><i class="fa fa-comments"></i> Room ID</label>
        <input type="text" id="node-input-roomId" placeholder="msg.topic">
        <pre class="form-tips" id="node-input-roomId-error" style="color: #721c24;background-color: #f8d7da;border-color: #f5c6cb;margin-bottom: 12px;margin-top: 12px;display:none;"></pre>
    </div>

    <div class="form-row">
        <label for="node-input-message"><i class="fa fa-comment"></i> Message</label>
        <textarea id="node-input-message" placeholder="msg.payload" style="width: 70%;"></textarea>
    </div>
    <div class="form-row form-tips">
        If message is an object it sets the full content of the message.
    </div>

    <div class="form-row">
        <input
                type="checkbox"
                id="node-input-replaceMessage"
                style="width: auto; margin-left: 105px; vertical-align: top"
        />
        <label for="node-input-replaceMessage" style="width: auto;max-width:50%;">
            Update existing message if <code>msg.eventId</code> is set
        </label>
    </div>

    <div class="form-row">
        <label for="node-input-messageType">
            Message Type
        </label>
        <select id="node-input-messageType">
            <option value="m.text">m.text</option>
            <option value="m.notice">m.notice</option>
            <option value="msg.type">msg.type input</option>
        </select>
    </div>
    <div class="form-row form-tips">
        It's recommended to use m.notice for bots because the message will render in a lighter text (at least in Element client) for users to distinguish bot and real user messages.
    </div>

    <div class="form-row">
        <label for="node-input-threadReply"><i class="fa fa-commenting-o"></i> Thread Reply</label>
        <input type="text" id="node-input-threadReply">
    </div>
    <div class="form-row form-tips">
        If true and <code>msg.content.['m.relates_to'].event_id</code> or <code>msg.eventId</code> (parsed in that order) is provided the message will be a thread reply to the original event.
    </div>

    <div class="form-row">
        <label for="node-input-replyTo"><i class="fa fa-reply"></i> Reply To</label>
        <input type="text" id="node-input-replyTo">
    </div>
    <div class="form-row form-tips">
        <code>true</code> replies to <code>msg.eventId</code> (the message from a Receive node), an event ID (starting with <code>$</code>) replies to that event, anything else sends a normal message.
    </div>
    <div class="form-row">
        <input
                type="checkbox"
                id="node-input-notifyReplySender"
                style="width: auto; margin-left: 105px; vertical-align: top"
        />
        <label for="node-input-notifyReplySender" style="width: auto;max-width:50%;">
            Notify the sender of the message being replied to
        </label>
    </div>

    <div class="form-row">
        <label for="node-input-mentionUsers"><i class="fa fa-at"></i> Mention Users</label>
        <input type="text" id="node-input-mentionUsers">
    </div>
    <div class="form-row">
        <label for="node-input-mentionRoom"><i class="fa fa-bullhorn"></i> Mention Room</label>
        <input type="text" id="node-input-mentionRoom">
    </div>
    <div class="form-row form-tips">
        Users to notify (a user ID, a comma separated list, or an array), and whether to notify the whole room (<code>@room</code>). Mentions only control who gets notified; write the names in the message text yourself.
    </div>

    <div class="form-row">
        <label for="node-input-messageFormat">
            Message Format
        </label>
        <select id="node-input-messageFormat">
            <option value="">Default (plaintext)</option>
            <option value="markdown">Markdown</option>
            <option value="html">HTML</option>
            <option value="msg.format">msg.format input</option>
        </select>
    </div>
    <script type="text/javascript">
        $(function(){
            $("#node-input-roomId").on("keyup", function() {
                if($(this).val() && !$(this).val().startsWith("!")) {
                    $("#node-input-roomId-error").html(`Room IDs start with exclamation point "!"<br />Example: !OGEhHVWSdvArJzumhm:matrix.org`).show();
                } else {
                    $("#node-input-roomId-error").hide();
                }
            }).trigger('keyup');
        });
    </script>
</script>

<script type="text/html" data-help-name="matrix-send-message">
    <h3>Details</h3>
    <p>Sends a message to a Matrix room. Messages are auto encrypted if necessary.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>msg.topic
            <span class="property-type">string</span>
        </dt>
        <dd> Room ID to send image to. Optional if configured on the node. If configured on the node this input will be overridden.</dd>

        <dt>msg.payload
            <span class="property-type">string|object</span>
        </dt>
        <dd> the message text or an object to customize the full content. If configured on the node this is ignored otherwise it required. </dd>

        <dt>msg.replace
            <span class="property-type">bool</span>
        </dt>
        <dd> If true and <code>msg.eventId</code> is present it will update an existing message. Posts a new message if false or <code>msg.eventId</code> is missing. </dd>

        <dt class="optional">msg.formatted_payload
            <span class="property-type">string</span>
        </dt>
        <dd> the formatted HTML message (uses <code>msg.payload</code> if not defined). This only affects messages sent in <strong>HTML</strong> format &mdash; in Markdown mode the formatted body is generated from the markdown source.</dd>

        <dt class="optional">msg.replyTo
            <span class="property-type">boolean | string</span>
        </dt>
        <dd> (default "Reply To" setting) <code>true</code> sends the message as a reply to <code>msg.eventId</code>; an event ID sends it as a reply to that event. When the node is also set to reply in a thread, the message is a reply inside the thread. Ignored when updating an existing message.</dd>

        <dt class="optional">msg.mentionUsers
            <span class="property-type">string | array</span>
        </dt>
        <dd> (default "Mention Users" setting) user IDs to notify, as a single ID, a comma separated list or an array, for example <code>["@alice:example.org"]</code>. Sent as <code>m.mentions</code>, so only these users (and the sender of a replied-to message) are notified, even if the text contains other names.</dd>

        <dt class="optional">msg.mentionRoom
            <span class="property-type">boolean</span>
        </dt>
        <dd> (default "Mention Room" setting) <code>true</code> notifies everyone in the room, like <code>@room</code>. The bot needs permission to notify the room.</dd>

        <dt class="optional">msg.type
            <span class="property-type">string | null</span>
        </dt>
        <dd> This is only used and required when configured so on the node. Must be set to either <code>'m.text'</code> or <code>'m.notice'</code></dd>

        <dt class="optional">msg.format
            <span class="property-type">string | null</span>
        </dt>
        <dd> This is only used and required when configured so on the node. Set to <code>null</code> for plain text, <code>'markdown'</code> for markdown (converted to HTML the same way Element does), or <code>'html'</code> for HTML.</dd>
    </dl>

    <h4>Message formats</h4>
    <dl class="message-properties">
        <dt>Default (plaintext)</dt>
        <dd>The payload is sent as-is as the message body.</dd>

        <dt>Markdown</dt>
        <dd>
            The payload is parsed as CommonMark markdown and converted to HTML
            the same way Element does (using the same converter ported from
            <code>matrix-react-sdk</code>). If the message turns out to contain
            no markdown syntax it is sent as plain text; otherwise the original
            markdown source becomes the message <code>body</code> and the
            rendered HTML is sent as <code>formatted_body</code>, so clients
            without HTML rendering still see a readable fallback.
        </dd>

        <dt>HTML</dt>
        <dd>
            The payload is sent as HTML. By default the same HTML is used for
            both the plain-text and formatted versions; set
            <code>msg.formatted_payload</code> if you want the
            <code>formatted_body</code> to differ from <code>msg.payload</code>.
        </dd>

        <dt>msg.format input</dt>
        <dd>Set <code>msg.format</code> at runtime to one of the options above (<code>null</code>, <code>'markdown'</code>, or <code>'html'</code>).</dd>
    </dl>

    <h4>Replies and mentions</h4>
    <p>
        Wire a Receive node straight into this node and set <b>Reply To</b> to <code>true</code> to answer
        each message as a reply. The sender of the original message is notified unless you untick
        <i>Notify the sender</i>. Replies, mentions and full content objects in <code>msg.payload</code>
        (for example from an Upload File node) can be combined; keys already in the content object are kept.
    </p>
    <p>
        The Receive node's <code>msg.mentions</code> describes who the <i>incoming</i> message mentioned and is
        not used here, so replying never repeats someone else's <code>@room</code>.
    </p>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Success
            <dl class="message-properties">
                <dt>msg.eventId <span class="property-type">string</span></dt>
                <dd>the eventId from the posted message.</dd>
            </dl>
        </li>
        <li>Error
            <dl class="message-properties">
                <dt>msg.error <span class="property-type">string</span></dt>
                <dd>the error that occurred.</dd>
            </dl>
        </li>
    </ol>
</script>
