<script type="text/javascript">
    RED.nodes.registerType('matrix-room-unban',{
        category: 'matrix',
        color: '#00b7ca',
        icon: "matrix.png",
        outputLabels: ["success", "error"],
        inputs:1,
        outputs:2,
        defaults: {
            name: { value: null },
            server: { type: "matrix-server-config" },
            roomId: { value: null },
            reason: { value: null }
        },
        label: function() {
            return this.name || "Room Unban";
        },
        paletteLabel: 'Room Unban'
    });
</script>

<script type="text/html" data-template-name="matrix-room-unban">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-user"></i> Matrix Server Config</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-roomId"><i class="fa fa-comments"></i> Room ID</label>
        <input type="text" id="node-input-roomId" placeholder="msg.topic">
    </div>
    <div class="form-row">
        <label for="node-input-reason"><i class="fa fa-comment"></i> Reason</label>
        <input type="text" id="node-input-reason" placeholder="msg.reason">
    </div>
</script>

<script type="text/html" data-help-name="matrix-room-unban">
    <h3>Details</h3>
    <p>Lifts a ban so the user can join the room again (they are not invited or joined automatically). The bot needs permission to ban users in the room.</p>
    <a href="https://spec.matrix.org/latest/client-server-api/#post_matrixclientv3roomsroomidunban" target="_blank">Matrix specification: unban</a>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>msg.userId <span class="property-type">string</span></dt>
        <dd> the user to unban.</dd>

        <dt class="optional">msg.topic <span class="property-type">string</span></dt>
        <dd> the room. Ignored if configured on the node, otherwise required.</dd>

        <dt class="optional">msg.reason <span class="property-type">string</span></dt>
        <dd> the reason for the unban. A reason configured on the node takes priority.</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Success
            <dl class="message-properties">
                <dt>msg <span class="property-type">object</span></dt>
                <dd>the input message, unchanged.</dd>
            </dl>
        </li>
        <li>Error
            <dl class="message-properties">
                <dt>msg.error <span class="property-type">string</span></dt>
                <dd>the error that occurred.</dd>
            </dl>
        </li>
    </ol>
</script>
